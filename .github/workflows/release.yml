name: release

on:
  push:
    tags:
      - v*.*.*

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Generate TypeScript SDK
        run: make sdk_nodejs

      - name: Set SDK version
        run: |
          VERSION="${{ github.ref_name }}"
          sed -i "s/\${VERSION}/${VERSION#v}/g" sdk/nodejs/package.json

      - name: Build TypeScript SDK
        working-directory: sdk/nodejs
        run: |
          npm install
          npm run build

      - name: Publish to npm
        working-directory: sdk/nodejs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python build tools
        run: pip install build

      - name: Generate Python SDK
        run: ./pulumi-tfgen-dagsterplus python --out sdk/python

      - name: Set Python SDK version
        run: |
          VERSION="${{ github.ref_name }}"
          sed -i "s/0.0.0/${VERSION#v}/g" sdk/python/setup.py

      - name: Build Python wheel
        run: cd sdk/python && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
