name: release

on:
  push:
    tags:
      - v*.*.*

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python build tools
        run: pip install build

      - name: Generate Python SDK
        run: ./pulumi-tfgen-dagsterplus python --out sdk/python

      - name: Set Python SDK version
        run: |
          VERSION="${{ github.ref_name }}"
          sed -i "s/0.0.0/${VERSION#v}/g" sdk/python/setup.py

      - name: Build Python wheel
        run: cd sdk/python && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

      - name: Build tfgen binary with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-X github.com/dagster-io/pulumi-dagsterplus/provider.Version=${VERSION}" \
            -o ./pulumi-tfgen-dagsterplus ./provider/cmd/pulumi-tfgen-dagsterplus

      - name: Generate Go SDK
        run: ./pulumi-tfgen-dagsterplus go --out sdk/go

      - name: Tidy Go SDK module
        run: cd sdk/go && go mod tidy

      - name: Verify Go SDK builds
        run: cd sdk/go && go build ./...

      - name: Commit and publish Go SDK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/go/
          if ! git diff --staged --quiet; then
            git commit -m "chore: generate Go SDK ${{ github.ref_name }}"
            git push origin HEAD:main
          fi
          git tag "sdk/go/${{ github.ref_name }}"
          git push origin "sdk/go/${{ github.ref_name }}"
